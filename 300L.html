<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>藍思值 300L 奇幻樂園 - 15 題大闖關</title>
  <!-- 引入彩帶拉炮特效庫 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: url('images/bg-300l.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      min-height: 100vh;
      padding: 25px 20px;
      color: #444;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      width: 100%;
      max-width: 860px;
      border-radius: 28px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.8);
      padding: 25px 30px;
      margin: auto 0;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed #ffb6c1;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    .header h1 { font-size: 24px; color: #d81b60; }
    .nav-btns { display: flex; gap: 10px; align-items: center; }
    .back-btn {
      text-decoration: none;
      background: #ff4081;
      color: white;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: bold;
      transition: 0.2s;
      font-size: 14px;
    }
    .back-btn:hover { background: #c2185b; transform: scale(1.05); }

    .sub-btn {
      background: #f06292;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }
    .sub-btn:hover { background: #d81b60; transform: scale(1.05); }

    /* ================= 階段一：書單篩選獨立面板 ================= */
    #selection-screen {
      padding: 10px 5px;
      text-align: center;
    }
    .selection-intro {
      font-size: 16px;
      color: #666;
      margin-bottom: 20px;
    }
    .filter-section {
      background: #fff0f5;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 25px;
      text-align: left;
    }
    .filter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-weight: bold;
      color: #c2185b;
      font-size: 15px;
    }
    .book-list { display: flex; flex-wrap: wrap; gap: 12px; }
    .book-chip {
      background: #ffffff;
      border: 2px solid #ffb6c1;
      padding: 8px 18px;
      border-radius: 22px;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s;
      user-select: none;
    }
    .book-chip.active {
      background: #ff4081;
      color: #ffffff;
      border-color: #ff4081;
      box-shadow: 0 4px 10px rgba(255, 64, 129, 0.3);
    }
    .start-game-btn {
      padding: 14px 40px;
      background: #ff4081;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 64, 129, 0.35);
      transition: 0.25s;
    }
    .start-game-btn:hover {
      background: #d81b60;
      transform: scale(1.05);
      box-shadow: 0 10px 24px rgba(216, 27, 96, 0.45);
    }

    /* ================= 階段二：遊戲專屬面板 ================= */
    #game-screen {
      display: none;
    }

    /* 三階段進度狀態 (順序：Match -> Memory -> QA) */
    .stage-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      background: #fdf0f4;
      padding: 10px 15px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
      color: #888;
    }
    .stage-step { padding: 4px 10px; border-radius: 8px; }
    .stage-step.current { background: #ff4081; color: white; }

    /* 遊戲主舞台 */
    .game-window {
      background: #ffffff;
      border: 2px solid #fce4ec;
      border-radius: 18px;
      padding: 25px;
      min-height: 400px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* 連連看 (Matching) */
    .match-container { display: flex; justify-content: space-between; width: 100%; gap: 20px; }
    .match-col { display: flex; flex-direction: column; gap: 12px; flex: 1; }
    .match-item {
      padding: 14px;
      background: #ffffff;
      border: 2px solid #ddd;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      transition: 0.2s;
    }
    .match-item.selected { border-color: #ff4081; background: #fff0f5; transform: scale(1.02); }
    .match-item.matched { background: #e8f5e9; border-color: #81c784; color: #2e7d32; cursor: default; }

    /* 對對碰 (Memory Cards) */
    .memory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      width: 100%;
      max-width: 540px;
    }
    .memory-card {
      aspect-ratio: 1;
      background: #ff80ab;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      padding: 8px;
      font-size: 15px;
      line-height: 1.3;
      word-break: break-word;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: all 0.25s ease-out;
      color: transparent;
      border: 3px solid transparent;
      text-align: center;
    }
    .memory-card.flipped {
      background: #ffffff;
      color: #d81b60;
      border-color: #ff4081;
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(255, 64, 129, 0.3);
    }
    .memory-card.matched {
      background: #e8f5e9;
      color: #2e7d32;
      border-color: #81c784;
      cursor: default;
      transform: scale(1);
    }

    /* 單選對答 (QA) */
    .quiz-box { width: 100%; text-align: left; }
    .book-tag {
      display: inline-block;
      background: #ffe4e1;
      color: #d81b60;
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .quiz-question { font-size: 19px; font-weight: bold; margin-bottom: 20px; color: #222; line-height: 1.5; }
    .options-grid { display: flex; flex-direction: column; gap: 12px; }
    .option-btn {
      padding: 14px 18px;
      background: #ffffff;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 16px;
      text-align: left;
      cursor: pointer;
      transition: 0.2s;
    }
    .option-btn:hover { background: #fff5f8; border-color: #ff4081; }
    .option-btn.correct { background: #c8e6c9 !important; border-color: #4caf50 !important; color: #2e7d32; }
    .option-btn.wrong { background: #ffcdd2 !important; border-color: #f44336 !important; color: #c62828; }

    /* Google 表單輸入區樣式 */
    .form-box {
      background: #fff8fa;
      border: 2px dashed #ff80ab;
      border-radius: 16px;
      padding: 20px;
      margin: 20px 0;
      width: 100%;
      max-width: 480px;
    }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      color: #c2185b;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #ffb6c1;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }
    .form-group input:focus {
      border-color: #ff4081;
      box-shadow: 0 0 8px rgba(255, 64, 129, 0.3);
    }

    /* 操作按鈕 */
    .action-btn {
      margin-top: 10px;
      padding: 12px 28px;
      background: #ff4081;
      color: white;
      border: none;
      border-radius: 24px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .action-btn:hover { background: #d81b60; transform: scale(1.04); }
    .cert-btn { background: #ff9800; }
    .cert-btn:hover { background: #f57c00; }
    .submit-form-btn { background: #4caf50; }
    .submit-form-btn:hover { background: #388e3c; }

    /* 獎狀彈窗樣式 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-content {
      background: white;
      border-radius: 24px;
      padding: 25px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .modal-content img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .close-modal {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 26px;
      cursor: pointer;
      color: #999;
      background: none;
      border: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🎡 藍思值 300L 奇幻樂園闖關玩</h1>
      <div class="nav-btns">
        <button id="btn-reselect" class="sub-btn" style="display:none;" onclick="goToSelectionScreen()">🔄 重選讀本</button>
        <a href="index.html" class="back-btn">⬅ 返回大地圖</a>
      </div>
    </div>

    <!-- 畫面 1：書籍勾選面板 -->
    <div id="selection-screen">
      <p class="selection-intro">請先勾選你看過或想挑戰的書籍讀本，系統將從你挑選的書目中出題！</p>
      
      <div class="filter-section">
        <div class="filter-header">
          <span>📖 讀本清單（支援單選或複選）：</span>
          <button id="btn-select-all" style="background:none;border:none;color:#ff4081;cursor:pointer;font-weight:bold;font-size:14px;">全部勾選</button>
        </div>
        <div class="book-list" id="book-list">載入書單中...</div>
      </div>

      <button class="start-game-btn" onclick="confirmAndStartGame()">🎮 開始闖關挑戰</button>
    </div>

    <!-- 畫面 2：遊戲進行面板 -->
    <div id="game-screen">
      <!-- 三階段進度狀態 (順序：Match -> Memory -> QA) -->
      <div class="stage-bar">
        <span class="stage-step" id="step-match">階段 1：連連看配對 (Matching)</span>
        <span class="stage-step" id="step-memory">階段 2：翻牌對對碰 (Memory)</span>
        <span class="stage-step" id="step-qa">階段 3：單選對答 (QA)</span>
      </div>

      <!-- 遊戲舞台 -->
      <div class="game-window" id="game-window">
        題目載入中...
      </div>
    </div>
  </div>

  <!-- 獎狀彈出視窗 -->
  <div class="modal-overlay" id="cert-modal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeCertModal()">×</button>
      <h2 style="color: #ff9800; margin-bottom: 15px;">🏅 榮譽過關獎狀</h2>
      
      <canvas id="cert-canvas" style="display:none;"></canvas>
      <img id="cert-display-img" src="" alt="專屬過關獎狀" style="max-width:100%; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); margin-bottom:15px;">
      
      <div>
        <a id="cert-download-link" href="#" download="Scholastic-300L-Certificate.png" class="action-btn cert-btn" style="text-decoration:none; display:inline-block;">📥 下載專屬獎狀</a>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================
       【Google 表單設定】
       ========================================================= */
    const GOOGLE_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSe1wq7V2HLV5ALzSzkmQ7ZkOR02nOIAqicxXZ_XQdwgZz-6Ig/formResponse";
    const ENTRY_NAME = "entry.10104725";    // 本名欄位 ID
    const ENTRY_LINE = "entry.393671221";   // LINE 名稱欄位 ID
    const ENTRY_SCORE = "entry.1127374980"; // 答對題數欄位 ID

    let rawData = null;
    let selectedBooks = []; // 改為預設全不選

    let currentSession = { match: [], memory: [], qa: [] };
    let currentPhase = 'match';
    let currentItemIdx = 0;
    let score = { matchDone: 0, memoryDone: 0, qaCorrect: 0, qaTotal: 0 };
    let isFormSubmitted = false;

    // 讀取題庫
    fetch('questions-300l.json')
      .then(res => res.json())
      .then(data => {
        rawData = data;
        selectedBooks = []; // 預設全不選
        renderBookChips();
      })
      .catch(err => {
        document.getElementById('book-list').innerHTML = `
          <p style="color:red;">⚠️ 無法讀取 questions-300l.json，請確認檔案已放置在同目錄中。</p>
        `;
      });

    /* 渲染書本膠囊選單 */
    function renderBookChips() {
      const container = document.getElementById('book-list');
      container.innerHTML = '';
      rawData.books.forEach(b => {
        const isSelected = selectedBooks.includes(b);
        const chip = document.createElement('div');
        chip.className = `book-chip ${isSelected ? 'active' : ''}`;
        chip.innerText = b;
        chip.onclick = () => {
          if (selectedBooks.includes(b)) {
            selectedBooks = selectedBooks.filter(x => x !== b);
          } else {
            selectedBooks.push(b);
          }
          chip.classList.toggle('active');
          updateSelectAllBtnText();
        };
        container.appendChild(chip);
      });

      updateSelectAllBtnText();

      document.getElementById('btn-select-all').onclick = () => {
        if (selectedBooks.length === rawData.books.length) {
          selectedBooks = [];
        } else {
          selectedBooks = [...rawData.books];
        }
        renderBookChips();
      };
    }

    /* 同步切換全選按鈕文字 */
    function updateSelectAllBtnText() {
      const btn = document.getElementById('btn-select-all');
      if (!btn || !rawData) return;
      if (selectedBooks.length === rawData.books.length && rawData.books.length > 0) {
        btn.innerText = '全部取消';
      } else {
        btn.innerText = '全部勾選';
      }
    }

    /* 切換至選書畫面 */
    function goToSelectionScreen() {
      document.getElementById('selection-screen').style.display = 'block';
      document.getElementById('game-screen').style.display = 'none';
      document.getElementById('btn-reselect').style.display = 'none';
    }

    /* 確認選書並進入遊戲 */
    function confirmAndStartGame() {
      if (selectedBooks.length === 0) {
        alert('請至少勾選一本你想挑戰的讀本！');
        return;
      }
      document.getElementById('selection-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'block';
      document.getElementById('btn-reselect').style.display = 'inline-block';
      startNewGameSession();
    }

    function samplePool(pool, targetCount = 5) {
      const shuffled = [...pool].sort(() => Math.random() - 0.5);
      return shuffled.slice(0, Math.min(targetCount, shuffled.length));
    }

    function startNewGameSession() {
      const win = document.getElementById('game-window');
      isFormSubmitted = false;
      const matchPool = rawData.matching.filter(m => selectedBooks.includes(m.book));
      const memPool = rawData.memory.filter(m => selectedBooks.includes(m.book));
      const qaPool = rawData.qa.filter(q => selectedBooks.includes(q.book));

      currentSession.match = samplePool(matchPool, 5);
      currentSession.memory = samplePool(memPool, 5);
      currentSession.qa = samplePool(qaPool, 5);

      score = {
        matchDone: 0,
        memoryDone: 0,
        qaCorrect: 0,
        qaTotal: currentSession.qa.length
      };

      currentPhase = 'match';
      currentItemIdx = 0;
      updateStageIndicators();

      if (currentSession.match.length > 0) {
        renderMatchQuestion();
      } else if (currentSession.memory.length > 0) {
        currentPhase = 'memory';
        updateStageIndicators();
        renderMemoryQuestion();
      } else if (currentSession.qa.length > 0) {
        currentPhase = 'qa';
        updateStageIndicators();
        renderQAQuestion();
      } else {
        win.innerHTML = '<p>所選讀本目前無題目，請點擊上方「重選讀本」勾選其他書籍。</p>';
      }
    }

    function updateStageIndicators() {
      document.getElementById('step-match').className = `stage-step ${currentPhase === 'match' ? 'current' : ''}`;
      document.getElementById('step-memory').className = `stage-step ${currentPhase === 'memory' ? 'current' : ''}`;
      document.getElementById('step-qa').className = `stage-step ${currentPhase === 'qa' ? 'current' : ''}`;
    }

    /* ---------------- 階段 1：連連看配對 (Matching) ---------------- */
    let selLeft = null, selRight = null;

    function renderMatchQuestion() {
      const win = document.getElementById('game-window');
      const m = currentSession.match[currentItemIdx];
      const leftList = [...m.pairs].sort(() => Math.random() - 0.5);
      const rightList = [...m.pairs].sort(() => Math.random() - 0.5);

      win.innerHTML = `
        <div style="width:100%;">
          <span class="book-tag" style="margin-bottom:15px;">📖 ${m.book} ｜ 連連看 第 ${currentItemIdx + 1} / ${currentSession.match.length} 組</span>
          <p style="margin-bottom:15px;color:#666;">點擊左側項目，再點擊右側對應的意思進行連線！</p>
          <div class="match-container">
            <div class="match-col" id="col-left">
              ${leftList.map(p => `<div class="match-item" data-id="${p.match}" onclick="onSelectLeft(this)">${p.item}</div>`).join('')}
            </div>
            <div class="match-col" id="col-right">
              ${rightList.map(p => `<div class="match-item" data-id="${p.match}" onclick="onSelectRight(this)">${p.match}</div>`).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function onSelectLeft(el) {
      if (el.classList.contains('matched')) return;
      document.querySelectorAll('#col-left .match-item').forEach(i => i.classList.remove('selected'));
      el.classList.add('selected');
      selLeft = el;
      checkMatch();
    }

    function onSelectRight(el) {
      if (el.classList.contains('matched')) return;
      document.querySelectorAll('#col-right .match-item').forEach(i => i.classList.remove('selected'));
      el.classList.add('selected');
      selRight = el;
      checkMatch();
    }

    function checkMatch() {
      if (selLeft && selRight) {
        if (selLeft.dataset.id === selRight.dataset.id) {
          selLeft.classList.add('matched');
          selRight.classList.add('matched');
        }
        selLeft.classList.remove('selected');
        selRight.classList.remove('selected');
        selLeft = null;
        selRight = null;

        if (document.querySelectorAll('#col-left .match-item:not(.matched)').length === 0) {
          score.matchDone++;
          setTimeout(() => {
            currentItemIdx++;
            if (currentItemIdx < currentSession.match.length) {
              renderMatchQuestion();
            } else {
              currentPhase = 'memory';
              currentItemIdx = 0;
              updateStageIndicators();
              if (currentSession.memory.length > 0) {
                renderMemoryQuestion();
              } else if (currentSession.qa.length > 0) {
                currentPhase = 'qa';
                updateStageIndicators();
                renderQAQuestion();
              } else {
                renderFinalResults();
              }
            }
          }, 800);
        }
      }
    }

    /* ---------------- 階段 2：翻牌對對碰 (Memory Cards) ---------------- */
    let memSelected = [];

    function renderMemoryQuestion() {
      const win = document.getElementById('game-window');
      const mem = currentSession.memory[currentItemIdx];

      let cardList = [];
      if (mem.pairs && Array.isArray(mem.pairs)) {
        mem.pairs.forEach((p, idx) => {
          cardList.push({ id: idx, text: p.en });
          cardList.push({ id: idx, text: p.zh });
        });
      } else if (mem.cards && Array.isArray(mem.cards)) {
        mem.cards.forEach((w, idx) => {
          cardList.push({ id: idx, text: w });
          cardList.push({ id: idx, text: w });
        });
      }

      cardList.sort(() => Math.random() - 0.5);

      win.innerHTML = `
        <div style="width:100%; display:flex; flex-direction:column; align-items:center;">
          <span class="book-tag" style="margin-bottom:15px;">📖 ${mem.book} ｜ 對對碰 第 ${currentItemIdx + 1} / ${currentSession.memory.length} 組</span>
          <p style="margin-bottom:15px;color:#666;">點開兩張卡片，將「英文單字」與「中文解釋」配對！</p>
          <div class="memory-grid">
            ${cardList.map(card => `
              <div class="memory-card" data-pair-id="${card.id}" onclick="onFlipCard(this)">
                ${card.text}
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function onFlipCard(card) {
      if (card.classList.contains('flipped') || card.classList.contains('matched') || memSelected.length >= 2) return;

      card.classList.add('flipped');
      memSelected.push(card);

      if (memSelected.length === 2) {
        const [c1, c2] = memSelected;

        if (c1.dataset.pairId === c2.dataset.pairId) {
          c1.classList.add('matched');
          c2.classList.add('matched');
          memSelected = [];

          if (document.querySelectorAll('.memory-card:not(.matched)').length === 0) {
            score.memoryDone++;
            setTimeout(() => {
              currentItemIdx++;
              if (currentItemIdx < currentSession.memory.length) {
                renderMemoryQuestion();
              } else {
                currentPhase = 'qa';
                currentItemIdx = 0;
                updateStageIndicators();
                if (currentSession.qa.length > 0) {
                  renderQAQuestion();
                } else {
                  renderFinalResults();
                }
              }
            }, 800);
          }
        } else {
          setTimeout(() => {
            c1.classList.remove('flipped');
            c2.classList.remove('flipped');
            memSelected = [];
          }, 700);
        }
      }
    }

    /* ---------------- 階段 3：單選對答 (QA) ---------------- */
    function renderQAQuestion() {
      const win = document.getElementById('game-window');
      const q = currentSession.qa[currentItemIdx];
      win.innerHTML = `
        <div class="quiz-box">
          <span class="book-tag">📖 ${q.book} ｜ 對答 第 ${currentItemIdx + 1} / ${currentSession.qa.length} 題</span>
          <div class="quiz-question">${q.question}</div>
          <div class="options-grid">
            ${q.options.map((opt, i) => `
              <button class="option-btn" onclick="submitQAAnswer(this, ${i}, ${q.answer})">${opt}</button>
            `).join('')}
          </div>
        </div>
      `;
    }

    function submitQAAnswer(btn, chosen, correct) {
      const parent = btn.parentElement;
      parent.querySelectorAll('.option-btn').forEach(b => b.style.pointerEvents = 'none');

      if (chosen === correct) {
        btn.classList.add('correct');
        score.qaCorrect++;
      } else {
        btn.classList.add('wrong');
        parent.querySelectorAll('.option-btn')[correct].classList.add('correct');
      }

      setTimeout(() => {
        currentItemIdx++;
        if (currentItemIdx < currentSession.qa.length) {
          renderQAQuestion();
        } else {
          renderFinalResults();
        }
      }, 1100);
    }

    /* ---------------- 過關彩帶拉炮特效 ---------------- */
    function triggerConfetti() {
      if (typeof confetti !== 'function') return;

      const duration = 3 * 1000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 1200 };

      function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
      }

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);

        const particleCount = 50 * (timeLeft / duration);

        confetti(Object.assign({}, defaults, {
          particleCount,
          origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
        }));
        confetti(Object.assign({}, defaults, {
          particleCount,
          origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
        }));
      }, 250);
    }

    /* ---------------- 結算與回傳表單 ---------------- */
    function renderFinalResults() {
      document.getElementById('step-match').className = 'stage-step';
      document.getElementById('step-memory').className = 'stage-step';
      document.getElementById('step-qa').className = 'stage-step';

      const totalScore = score.matchDone + score.memoryDone + score.qaCorrect;
      const totalPossible = currentSession.match.length + currentSession.memory.length + currentSession.qa.length;
      const isPassed = totalScore >= 11;
      const win = document.getElementById('game-window');

      if (isPassed) {
        triggerConfetti();
      }

      win.innerHTML = `
        <div style="padding: 10px; width:100%; display:flex; flex-direction:column; align-items:center;">
          ${isPassed ? `
            <h2 style="color:#2e7d32; font-size:26px; margin-bottom:8px;">🎉 恭喜你成功過關！</h2>
            <p style="color:#666; margin-bottom:15px;">太棒了！你的表現非常優異！</p>
          ` : `
            <h2 style="color:#d32f2f; font-size:26px; margin-bottom:8px;">😢 闖關失敗，再接再厲！</h2>
            <p style="color:#666; margin-bottom:15px;">只要答對 11 題以上就能獲得榮譽獎狀喔！</p>
          `}

          <div style="background:#fff0f5; padding:15px 25px; border-radius:16px; margin-bottom:15px; width:100%; max-width:480px; text-align:left; line-height:2; font-size:15px;">
            <p>🔗 <b>連連看完成組數</b>：${score.matchDone} / ${currentSession.match.length} 分</p>
            <p>🃏 <b>中英翻牌對對碰完成</b>：${score.memoryDone} / ${currentSession.memory.length} 分</p>
            <p>🎯 <b>單選對答正確率</b>：${score.qaCorrect} / ${score.qaTotal} 分</p>
            <hr style="border:none; border-top:1px dashed #ffb6c1; margin:6px 0;">
            <p style="color:${isPassed ? '#2e7d32' : '#d32f2f'}; font-weight:bold; font-size:18px;">
              🏆 最終總得分：${totalScore} / ${totalPossible} 分
            </p>
          </div>

          <!-- 回傳 Google 表單輸入區 -->
          <div class="form-box">
            <h3 style="color:#d81b60; font-size:17px; margin-bottom:12px;">📝 登記闖關成績</h3>
            <div class="form-group">
              <label for="user-name">答題者本名：</label>
              <input type="text" id="user-name" placeholder="請輸入姓名" />
            </div>
            <div class="form-group">
              <label for="user-line">LINE 名稱：</label>
              <input type="text" id="user-line" placeholder="請輸入 LINE 暱稱" />
            </div>
            <button class="action-btn submit-form-btn" id="btn-submit-score" onclick="submitToGoogleForm(${totalScore})">
              📤 送出成績登記
            </button>
            <p id="form-msg" style="margin-top:10px; font-weight:bold; font-size:14px; display:none;"></p>
          </div>

          <!-- 底部功能按鈕 -->
          <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
            ${isPassed ? `
              <button class="action-btn cert-btn" onclick="openCertModal()">🏅 領取獎狀</button>
              <button class="action-btn" onclick="startNewGameSession()">🔄 再玩一輪</button>
              <button class="action-btn" style="background:#ba68c8;" onclick="goToSelectionScreen()">📚 挑選其他讀本</button>
            ` : `
              <button class="action-btn" onclick="startNewGameSession()">🔄 再次闖關</button>
              <button class="action-btn" style="background:#ba68c8;" onclick="goToSelectionScreen()">📚 挑選其他讀本</button>
            `}
          </div>
        </div>
      `;
    }

    /* 送出成績到 Google 表單 */
    function submitToGoogleForm(scoreVal) {
      if (isFormSubmitted) {
        alert('您已經送出過成績囉！');
        return;
      }

      const name = document.getElementById('user-name').value.trim();
      const line = document.getElementById('user-line').value.trim();
      const msg = document.getElementById('form-msg');
      const submitBtn = document.getElementById('btn-submit-score');

      if (!name || !line) {
        alert('請填寫「本名」與「LINE 名稱」後再送出！');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = '傳送中...';

      const formData = new FormData();
      formData.append(ENTRY_NAME, name);
      formData.append(ENTRY_LINE, line);
      formData.append(ENTRY_SCORE, `${scoreVal} 題 (300L)`);

      fetch(GOOGLE_FORM_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: formData
      })
      .then(() => {
        isFormSubmitted = true;
        submitBtn.style.background = '#888';
        submitBtn.innerText = '✅ 成績已送出';
        msg.style.display = 'block';
        msg.style.color = '#2e7d32';
        msg.innerText = '🎉 成績已成功回傳至系統！';
      })
      .catch(err => {
        submitBtn.disabled = false;
        submitBtn.innerText = '📤 送出成績登記';
        msg.style.display = 'block';
        msg.style.color = '#d32f2f';
        msg.innerText = '⚠️ 傳送失敗，請稍後再試。';
      });
    }

    /* 獎狀動態合成與彈窗控制 */
    function openCertModal() {
      const nameInput = document.getElementById('user-name');
      let studentName = nameInput ? nameInput.value.trim() : "";
      if (!studentName) {
        studentName = "小小閱讀家";
      }

      const canvas = document.getElementById('cert-canvas');
      const ctx = canvas.getContext('2d');
      const certImg = new Image();

      certImg.src = 'images/certificates/cert-300l.png';

      certImg.onload = function() {
        canvas.width = certImg.naturalWidth;
        canvas.height = certImg.naturalHeight;

        ctx.drawImage(certImg, 0, 0);

        const fontSize = Math.floor(canvas.width * 0.045);
        ctx.font = `bold ${fontSize}px "PingFang TC", "Microsoft JhengHei", sans-serif`;
        ctx.fillStyle = '#2c3e50';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';

        const lineX = canvas.width * 0.68;
        const lineY = canvas.height * 0.465;

        ctx.fillText(studentName, lineX, lineY);

        const finalImageURL = canvas.toDataURL('image/png');
        document.getElementById('cert-display-img').src = finalImageURL;
        
        const downloadBtn = document.getElementById('cert-download-link');
        downloadBtn.href = finalImageURL;
        downloadBtn.download = `${studentName}_300L_闖關獎狀.png`;

        document.getElementById('cert-modal').style.display = 'flex';
      };
    }

    function closeCertModal() {
      document.getElementById('cert-modal').style.display = 'none';
    }
  </script>
</body>
</html>
