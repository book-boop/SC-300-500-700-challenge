<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholastic 學樂閱讀闖關玩</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #358c49 0%, #1f5a2e 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      padding: 20px;
    }

    /* 遊戲主畫面容器：鎖定比例並自適應螢幕 */
    .game-board {
      position: relative;
      width: 100%;
      max-width: 950px;
      aspect-ratio: 1 / 1;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      border-radius: 28px;
      overflow: hidden;
      background-color: #f7f9f4;
    }

    /* 底圖 */
    .map-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    /* PNG 圖片按鈕共同樣式 */
    .img-btn {
      position: absolute;
      display: block;
      cursor: pointer;
      text-decoration: none;
      z-index: 10;
      transform-origin: center center;
      transition: transform 0.25s ease-out, filter 0.25s ease-out;
      overflow: visible;
    }

    .img-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    /* 滑鼠懸停 (Hover)：霓虹金黃外發光（精準貼合 PNG 邊緣）+ 放大跳動 */
    .img-btn:hover {
      z-index: 20;
      filter: drop-shadow(0 0 10px #ffe600)
              drop-shadow(0 0 22px #ffb300)
              drop-shadow(0 0 32px rgba(255, 235, 59, 0.85));
      animation: floatBounce 1.1s ease-in-out infinite alternate;
    }

    /* 上下浮動跳動動畫 */
    @keyframes floatBounce {
      0% {
        transform: translateY(0) scale(1.03);
      }
      100% {
        transform: translateY(-8px) scale(1.06);
      }
    }

    /* 點擊時按壓反饋 */
    .img-btn:active {
      transform: translateY(2px) scale(0.98);
      filter: drop-shadow(0 0 14px #ffd700);
    }

    /* 藍思值 700L 探索冒險定位 */
    .btn-700l {
      top: 20.8%;
      left: 33.2%;
      width: 35.8%;
      height: 31%;
    }

    /* 藍思值 500L 水上狂歡定位 */
    .btn-500l {
      top: 52.4%;
      left: 4.8%;
      width: 44.5%;
      height: 40.2%;
    }

    /* 藍思值 300L 奇幻樂園定位 */
    .btn-300l {
      top: 58.2%;
      left: 58%;
      width: 37.8%;
      height: 37.5%;
    }
  </style>
</head>
<body>

  <div class="game-board">
    <!-- 主背景底圖 -->
    <img src="bg-main.jpg" alt="學樂閱讀闖關玩地圖" class="map-bg">

    <!-- 700L 探索冒險按鈕 -->
    <a href="700L.html" class="img-btn btn-700l" title="進入 藍思值 700L 探索冒險">
      <img src="btn-700l.png" alt="700L 探索冒險">
    </a>

    <!-- 500L 水上狂歡按鈕 -->
    <a href="500L.html" class="img-btn btn-500l" title="進入 藍思值 500L 水上狂歡">
      <img src="btn-500l.png" alt="500L 水上狂歡">
    </a>

    <!-- 300L 奇幻樂園按鈕 -->
    <a href="300L.html" class="img-btn btn-300l" title="進入 藍思值 300L 奇幻樂園">
      <img src="btn-300l.png" alt="300L 奇幻樂園">
    </a>
  </div>

</body>
</html>
