<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholastic 學樂閱讀闖關玩</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #358c49 0%, #1f5a2e 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      padding: 20px;
    }

    /* 遊戲容器：強制與底圖等比例 (1024 / 1024 = 1/1) */
    .game-board {
      position: relative;
      width: 100%;
      max-width: 950px;
      aspect-ratio: 1 / 1;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      border-radius: 28px;
      overflow: hidden;
      background-color: #f7f9f4;
    }

    /* 底圖 */
    .map-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: fill; /* 確保底圖填滿容器，不因不同螢幕比例變形 */
      user-select: none;
      pointer-events: none;
    }

    /* 按鈕容器共同樣式 */
    .img-btn {
      position: absolute;
      display: block;
      cursor: pointer;
      text-decoration: none;
      z-index: 10;
      transition: transform 0.25s ease-out, filter 0.25s ease-out;
      /* 【除錯技巧】：如果想看目前按鈕方框在哪裡，把下一行的註解拿掉： */
      /* outline: 2px dashed red; */
    }

    .img-btn img {
      width: 100%;
      height: 100%;
      object-fit: fill; /* 讓圖片精確貼合外框大小 */
      display: block;
      pointer-events: none;
    }

    /* 滑鼠懸停 (Hover) 效果 */
    .img-btn:hover {
      z-index: 25;
      filter: drop-shadow(0 0 10px #ffe600)
              drop-shadow(0 0 20px #ffb300)
              drop-shadow(0 0 35px rgba(255, 235, 59, 0.9));
      animation: floatBounce 1s ease-in-out infinite alternate;
    }

    @keyframes floatBounce {
      0% {
        transform: translateY(0) scale(1.02);
      }
      100% {
        transform: translateY(-6px) scale(1.05);
      }
    }

    .img-btn:active {
      transform: translateY(2px) scale(0.98);
      filter: drop-shadow(0 0 12px #ffd700);
    }

    /* ========================================================
       【精準座標與尺寸調整區】
       根據你的原圖比例重新校對：
       ======================================================== */

    /* 1. 藍思值 700L 探索冒險（上方中央偏左，含城堡、樹屋與書本） */
    .btn-700l {
      top: 19.5%;
      left: 23.8%;
      width: 51.5%;
      height: 40.5%;
    }

    /* 2. 藍思值 500L 水上狂歡（左下角滑水道與水池） */
    .btn-500l {
      top: 49.5%;
      left: 0.5%;
      width: 50.5%;
      height: 43.5%;
    }

    /* 3. 藍思值 300L 奇幻樂園（右下角旋轉木馬與粉紅攤位） */
    .btn-300l {
      top: 57.5%;
      left: 50%;
      width: 50%;
      height: 38.5%;
    }
  </style>
</head>
<body>

  <div class="game-board">
    <img src="bg-main.jpg" alt="學樂閱讀闖關玩地圖" class="map-bg">

    <a href="700L.html" class="img-btn btn-700l" title="進入 藍思值 700L 探索冒險">
      <img src="btn-700l.png" alt="700L 探索冒險">
    </a>

    <a href="500L.html" class="img-btn btn-500l" title="進入 藍思值 500L 水上狂歡">
      <img src="btn-500l.png" alt="500L 水上狂歡">
    </a>

    <a href="300L.html" class="img-btn btn-300l" title="進入 藍思值 300L 奇幻樂園">
      <img src="btn-300l.png" alt="300L 奇幻樂園">
    </a>
  </div>

</body>
</html>
